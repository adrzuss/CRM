{% extends 'base.html' %}
{% block body %}

    <h3 class="m-3">Rubros y marcas</h3>
    <div class="row m-3">
        {% include 'partials/_rubros.html' %}
        {% include 'partials/_marcas.html' %}
    </div>

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/datatable/datatables.css') }}">
    <script src="{{ url_for('static', filename='vendor/datatable/datatables.js') }}"></script>

    <script nonce="{{ g.nonce }}">
        new DataTable('#marcasTable', {
            pageLength: 10,
            perPageSelect: [10, 25, 50, 100],
            searchable: true,
            sortable: true,
            language: {
                url: "{{ url_for('static', filename='vendor/datatable/i18n/es-ES.json') }}"
            }
            
        });
        new DataTable('#rubrosTable', {
            perPage: 10,
            perPageSelect: [10, 25, 50, 100],
            searchable: true,
            sortable: true,
            language: {
                url: "{{ url_for('static', filename='vendor/datatable/i18n/es-ES.json') }}"
            },
            labels: {
                placeholder: 'Buscar...',
                perPage: '{select} registros por página',
                noRows: 'No se encontraron registros',
                info: 'Mostrando {start} a {end} de {rows} registros',
            },
        });
    </script>
{% endblock %}
