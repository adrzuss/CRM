{# Formulario de edición - Impuesto #}
<h5 class="mb-3">Editar Impuesto</h5>
<form hx-post="{{ url_for('configuraciones.update_impuesto', id=item.id) }}"
      hx-target="#tabla-impuestos"
      hx-swap="innerHTML">
    <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <input type="text" class="form-control" name="descripcion" id="descripcion" maxlength="100" value="{{ item.descripcion }}" required>
    </div>
    <div class="mb-3">
        <label for="alicuota" class="form-label">Alícuota (%)</label>
        <input type="number" step="0.01" class="form-control" name="alicuota" id="alicuota" value="{{ item.alicuota }}" required>
    </div>
    <div class="mb-3">
        <label for="compras_ventas" class="form-label">Aplica a</label>
        <select class="form-select" name="compras_ventas" id="compras_ventas" required>
            <option value="compras" {% if item.compras_ventas == 'compras' %}selected{% endif %}>Compras</option>
            <option value="ventas" {% if item.compras_ventas == 'ventas' %}selected{% endif %}>Ventas</option>
            <option value="ambas" {% if item.compras_ventas == 'ambas' %}selected{% endif %}>Ambas</option>
        </select>
    </div>
    <div class="mb-3">
        <div class="form-check">
            <input type="checkbox" class="form-check-input" name="activo" id="activo" value="1" {% if item.activo %}checked{% endif %}>
            <label class="form-check-label" for="activo">Activo</label>
        </div>
    </div>
    <div class="modal-footer px-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-exito">Guardar cambios</button>
    </div>
</form>
